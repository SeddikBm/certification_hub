# Configuration de l'application
spring.application.name=certification-hub-backend

# Base de données PostgreSQL
# URL de connexion au conteneur Docker exposé sur le port 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/certifhub_db
spring.datasource.username=certif_user
spring.datasource.password=certif_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA / Hibernate
# Affiche les requêtes SQL dans la console pour faciliter le débogage
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Importation automatique des migrations Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Important : On désactive la création automatique des tables par Hibernate
# car nous utiliserons un outil de migration (Flyway/Liquibase) pour de bonnes pratiques.
spring.jpa.hibernate.ddl-auto=validate


spring.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
spring.security.jwt.access-token-expiration=900000
spring.security.jwt.refresh-token-expiration=604800000

# Gestion des erreurs au standard RFC 7807
spring.mvc.problemdetails.enabled=true

# Configuration SMTP Mail (Gmail Direct)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:zoikilwa1234@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:CHANGE_ME_SET_ENV_VAR}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.mail.from=${SPRING_MAIL_FROM:zoikilwa1234@gmail.com}
spring.mail.default-encoding=UTF-8

# Configuration de la taille des fichiers (Spring Boot natif)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Configuration du dossier de sauvegarde (Personnalisé)
app.storage.upload-dir=./uploads/certificates

# Pagination: page commence à 1 (au lieu de 0) et utiliser 'limit' (au lieu de 'size')
# spring.data.web.pageable.one-indexed-parameters=true
# spring.data.web.pageable.size-parameter=limit
# spring.data.web.pageable.default-page-size=25
      
# Configuration du serveur web  
server.port=9090

# ─── Moteur de Validation IA (FastAPI backend-ai) ─────────────────────────────
# URL du service backend-ai (overridée en Docker via env var AI_VALIDATION_URL)
app.ai-validation.url=${AI_VALIDATION_URL:http://localhost:8000}
# Clé partagée pour l'authentification inter-services (header X-API-Key)
app.ai-validation.api-key=${AI_API_KEY:certifhub-internal-key-2026}
# Désactiver temporairement si le moteur IA est indisponible (dégradation gracieuse)
app.ai-validation.enabled=${AI_VALIDATION_ENABLED:true}