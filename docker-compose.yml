services:
  # 1. Base de données PostgreSQL avec pgvector
  postgres-db:
    image: ankane/pgvector:latest
    container_name: certifhub_db
    environment:
      POSTGRES_USER: certif_user
      POSTGRES_PASSWORD: certif_password
      POSTGRES_DB: certifhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Outil de visualisation web pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: certifhub_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@devoteam.com
      PGADMIN_DEFAULT_PASSWORD: seddik
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    restart: unless-stopped

  # 3. Serveur de messagerie RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: certifhub_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  # 4. Backend AI — Moteur de Validation IA (FastAPI + LangGraph + PaddleOCR)
  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: certifhub_ai
    ports:
      - "8000:8000"
    env_file:
      - ./backend-ai/.env
    restart: unless-stopped

  # 5. Backend Spring Boot Application
  backend-spring:
    build:
      context: ./backend-spring
      dockerfile: Dockerfile
    container_name: certifhub_backend
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/certifhub_db
      SPRING_DATASOURCE_USERNAME: certif_user
      SPRING_DATASOURCE_PASSWORD: certif_password
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM}
      AI_VALIDATION_URL: http://backend-ai:8000
      AI_API_KEY: certifhub-internal-key-2026
      AI_VALIDATION_ENABLED: "true"
    depends_on:
      - postgres-db
      - rabbitmq
      - backend-ai
    restart: unless-stopped

  # 6. Frontend React / Vite Application (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: certifhub_frontend
    ports:
      - "80:80"
    depends_on:
      - backend-spring
    restart: unless-stopped

volumes:
  postgres_data:
