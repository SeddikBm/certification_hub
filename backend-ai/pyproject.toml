[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -m 'not live'"
markers = [
    "live: hits real external issuer sites and needs real internet access — never runs by default (see tests/test_live_scraper.py), invoke explicitly with `-m live`",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "UP042", # str,Enum kept instead of StrEnum for broader interpreter compat
    "B008",  # FastAPI's File()/Form()/Depends() defaults are the idiomatic pattern
]
