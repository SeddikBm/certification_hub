# Configuration de l'application
spring.application.name=certification-hub-backend

# Base de données PostgreSQL
# URL de connexion au conteneur Docker exposé sur le port 5432
spring.datasource.url=jdbc:postgresql://localhost:5432/certifhub_db
spring.datasource.username=certif_user
spring.datasource.password=certif_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA / Hibernate
# Affiche les requêtes SQL dans la console pour faciliter le débogage
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Importation automatique des migrations Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Important : On désactive la création automatique des tables par Hibernate
# car nous utiliserons un outil de migration (Flyway/Liquibase) pour de bonnes pratiques.
spring.jpa.hibernate.ddl-auto=validate


spring.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
spring.security.jwt.access-token-expiration=900000
spring.security.jwt.refresh-token-expiration=604800000

# Gestion des erreurs au standard RFC 7807
spring.mvc.problemdetails.enabled=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ton-email@gmail.com
spring.mail.password=ton-mot-de-passe-application
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

