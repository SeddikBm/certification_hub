<body class="min-h-screen bg-surface flex items-center justify-center p-gutter font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container relative overflow-hidden">

<div class="absolute top-[-10%] right-[-5%] w-[40vw] h-[40vw] rounded-full bg-primary/5 blur-3xl mix-blend-multiply"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[30vw] h-[30vw] rounded-full bg-secondary/5 blur-3xl mix-blend-multiply"></div>
</div>
<!-- Login Card -->
<main class="w-full max-w-[440px] z-10 relative">
<div class="bg-surface-container-lowest rounded-xl ambient-shadow p-stack-lg md:p-[40px] flex flex-col gap-stack-lg border border-outline-variant/30">
<!-- Header -->
<header class="flex flex-col items-center gap-stack-md text-center">
<img class="h-12 w-auto object-contain mb-unit" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD4nx3vEZNtYlXHnIVRZqTTylfszBJCGNZbOBVytpN4RnjCv9viAl-HujRyiqMQ2je7LY1zJHQBuEs_x-PqdWAesnn2JLCLlf7ZTCI-cFsabW9y3fATeS4cEwtUJ9wVJxR9m3i78AOUreLNS1KNv1GebI78MURb5brVgapRnTS2vDe1atRcRLCUwz3l57nR5DzfLq_Uhg2RmYY9jfS6XCgUyAOHuNw9tTPEpjas7DpMPXq4lXewQ2tD4OO9P2rxBNrMxOQ">
<div class="flex flex-col gap-unit">
<h1 class="font-headline-md text-headline-md text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to Devoteam Enterprise Portal</p>
</div>
</header>
<!-- Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="email" name="email" placeholder="name@devoteam.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm w-full bg-primary text-on-primary font-label-md text-label-md py-[14px] rounded-xl flex items-center justify-center gap-2 transition-all duration-300 hover:bg-on-primary-fixed-variant hover:-translate-y-[2px] active:translate-y-[0px] shadow-sm hover:shadow-md" type="submit">
<span class="">Login</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Footer / Support -->
<div class="pt-stack-md border-t border-outline-variant/30 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Need help? <a class="font-label-md text-label-md text-primary hover:underline underline-offset-4" href="#">Contact IT Support</a>
</p>
